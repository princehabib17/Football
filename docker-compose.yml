version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: kickslot-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: kickslot123
      MONGO_INITDB_DATABASE: kickslot
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - kickslot-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/kickslot --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kickslot-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:kickslot123@mongodb:27017/kickslot?authSource=admin
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-your-production-jwt-secret-change-this}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CURRENCY: php
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - kickslot-network
    volumes:
      - ./backend/logs:/usr/src/app/logs

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kickslot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    depends_on:
      - backend
    networks:
      - kickslot-network

networks:
  kickslot-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
